packages:
  - research/08-module-evaluation/experiment
  - research/16-undo-redo/tldraw
  - research/23-build-progress/experiment
  - research/22-document-canvases/tldraw-view
  - src/cad
  - src/drawio
  - src/features
  - src/harness
  - src/undo
allowBuilds:
  cbor-extract: true
  esbuild: true
  # pushwork's native deps; their prebuilt binaries suffice.
  lmdb: false
  msgpackr-extract: false
  sharp: true
minimumReleaseAgeExclude:
  - "@inkandswitch/*"
  - "@automerge/*"
# As in the public site: one automerge for every package, so the wasm the site
# serves matches the JS glue (automerge-repo pins 3.3.2, patchwork 3.5.0).
overrides:
  "@automerge/automerge": 3.4.1
  # patchwork-e2e pins its own; one Playwright, matching the browsers the flake provides.
  "@playwright/test": 1.64.1
